<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>my_cursor 本地聊天测试页</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      max-width: 900px;
    }
    textarea {
      width: 100%;
      height: 120px;
      padding: 8px;
      box-sizing: border-box;
      resize: vertical;
    }
    .actions {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    button {
      padding: 8px 16px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    pre {
      background: #f7f7f7;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      padding: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 120px;
    }
    .hint {
      color: #555;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h2>my_cursor 聊天测试页</h2>
  <p class="hint">
    流式：<code>WebSocket /api/chat/ws</code>；
    非流式：<code>POST /api/chat</code>。
  </p>
  <p class="hint">当前会话：<code id="sessionIdText">未创建</code></p>

  <label for="msg">消息</label>
  <textarea id="msg" placeholder="例如：你好，简单介绍一下你自己"></textarea>
  <div class="actions">
    <button id="sendStreamBtn" type="button">流式发送 (WebSocket)</button>
    <button id="sendBtn" type="button">非流式 (HTTP JSON)</button>
  </div>

  <h3>响应</h3>
  <pre id="result">等待请求...</pre>

  <script>
    const sendBtn = document.getElementById("sendBtn");
    const sendStreamBtn = document.getElementById("sendStreamBtn");
    const msgInput = document.getElementById("msg");
    const resultEl = document.getElementById("result");
    const sessionIdText = document.getElementById("sessionIdText");
    let sessionId = localStorage.getItem("session_id") || "";
    renderSessionId();

    function renderSessionId() {
      sessionIdText.textContent = sessionId || "未创建";
    }

    function updateSessionId(id) {
      if (!id || id === sessionId) return;
      sessionId = id;
      localStorage.setItem("session_id", sessionId);
      renderSessionId();
    }

    function wsURL() {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      return proto + "//" + location.host + "/api/chat/ws";
    }

    sendStreamBtn.addEventListener("click", () => {
      const msg = msgInput.value.trim();
      if (!msg) {
        resultEl.textContent = "请输入消息";
        return;
      }

      resultEl.textContent = "";
      sendStreamBtn.disabled = true;
      sendBtn.disabled = true;
      const flushIntervalMs = 80;
      let buffer = "";
      let flushTimer = null;

      const flush = () => {
        if (!buffer) return;
        resultEl.textContent += buffer;
        buffer = "";
      };

      const stopFlush = () => {
        if (flushTimer !== null) {
          clearInterval(flushTimer);
          flushTimer = null;
        }
      };

      const ws = new WebSocket(wsURL());
      ws.onopen = () => {
        flushTimer = setInterval(flush, flushIntervalMs);
        ws.send(JSON.stringify({ msg, session_id: sessionId }));
      };
      ws.onmessage = (ev) => {
        let data;
        try {
          data = JSON.parse(ev.data);
        } catch {
          resultEl.textContent += "\n[解析失败] " + ev.data;
          ws.close();
          return;
        }
        if (data.type === "delta" && data.content) {
          buffer += data.content;
        } else if (data.type === "meta" && data.session_id) {
          updateSessionId(data.session_id);
        } else if (data.type === "error") {
          flush();
          resultEl.textContent += "\n[错误] " + (data.message || "");
          ws.close();
        } else if (data.type === "done") {
          if (data.session_id) updateSessionId(data.session_id);
          flush();
          ws.close();
        }
      };
      ws.onerror = () => {
        flush();
        resultEl.textContent += "\n[WebSocket 错误]";
      };
      ws.onclose = () => {
        stopFlush();
        flush();
        sendStreamBtn.disabled = false;
        sendBtn.disabled = false;
      };
    });

    sendBtn.addEventListener("click", async () => {
      const msg = msgInput.value.trim();
      if (!msg) {
        resultEl.textContent = "请输入消息";
        return;
      }

      resultEl.textContent = "请求中...";
      sendStreamBtn.disabled = true;
      sendBtn.disabled = true;
      try {
        const resp = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ msg, session_id: sessionId })
        });

        const data = await resp.json();
        if (data.session_id) updateSessionId(data.session_id);
        resultEl.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        resultEl.textContent = "请求失败: " + String(err);
      } finally {
        sendStreamBtn.disabled = false;
        sendBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
